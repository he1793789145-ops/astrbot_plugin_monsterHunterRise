# ruff 配置。
#
# 只启用「安全、不改变行为」的规则集：
#   E/W  pycodestyle 错误与警告
#   F    pyflakes（未使用导入、未定义名）
#   I    isort（导入排序）
#   UP   pyupgrade（旧语法现代化，可能改代码，见下）
#   B    flake8-bugbear（常见陷阱）
#   SIM   flake8-simplify
#
# 刻意**不启用**会改变运行语义的规则（如全量 pyupgrade 的 PEP 604 改写），
# 因为本插件要同时兼容 AstrBot 运行环境的多个 Python 版本。

target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "B", "SIM", "UP"]
ignore = [
    # UP038（isinstance 用 X | Y）在 py311 下是运行时行为变化，保守起见不启用
    "UP038",
    # E501 由 formatter 统一处理，避免 lint 与 format 互相打架
    "E501",
]

[lint.per-file-ignores]
# tools/ 下的脚本是独立运行的，允许 print 与较长的命令行
"tools/*.py" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
